<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; min-width: 300px; width: 320px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #16161a; color: #f0f0f2; font-size: 17px;
  }
  header { padding: 18px 18px 6px; }
  h1 { font-size: 20px; margin: 0; display: flex; align-items: center; gap: 8px; }
  .host { font-size: 14px; color: #9a9aa2; margin: 4px 0 0; word-break: break-all; }
  .section { padding: 12px 18px; border-top: 1px solid #26262e; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .label { font-size: 17px; }
  .desc { font-size: 13px; color: #8f8f98; margin-top: 3px; }

  /* Interruttore grande e accessibile */
  .switch { position: relative; width: 58px; height: 34px; flex: 0 0 auto; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; inset: 0; background: #3a3a44; border-radius: 999px;
    transition: background .18s;
  }
  .slider::before {
    content: ""; position: absolute; height: 28px; width: 28px; left: 3px; top: 3px;
    background: #fff; border-radius: 50%; transition: transform .18s;
  }
  input:checked + .slider { background: #6d5cff; }
  input:checked + .slider::before { transform: translateX(24px); }

  input[type="range"] { width: 100%; height: 32px; accent-color: #6d5cff; margin: 8px 0 2px; }
  .range-val { font-size: 14px; color: #c3aaff; float: right; }

  .btn-reset {
    width: 100%; margin-top: 10px; padding: 12px; font-size: 15px;
    background: #23232b; color: #d0d0d6; border: 1px solid #33333d;
    border-radius: 12px; cursor: pointer;
  }
  .btn-reset:active { background: #2c2c36; }
  footer { padding: 10px 18px 16px; font-size: 12px; color: #6c6c74; text-align: center; }
</style>
</head>
<body>
  <header>
    <h1>🌙 Notte</h1>
    <p class="host" id="host">…</p>
  </header>

  <div class="section">
    <div class="row">
      <div>
        <div class="label">Scuro su questo sito</div>
        <div class="desc" id="siteDesc">Attivo</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="siteToggle">
        <span class="slider"></span>
      </label>
    </div>
    <button class="btn-reset" id="resetSite" hidden>↺ Usa l'impostazione predefinita</button>
  </div>

  <div class="section">
    <div class="label">Luminosità <span class="range-val" id="brightVal">100%</span></div>
    <input type="range" id="brightness" min="50" max="100" step="5" value="100">
    <div class="desc">Abbassala se il bianco ti dà ancora fastidio.</div>
  </div>

  <div class="section">
    <div class="label">Contrasto <span class="range-val" id="contrastVal">100%</span></div>
    <input type="range" id="contrast" min="90" max="115" step="5" value="100">
  </div>

  <div class="section">
    <div class="row">
      <div>
        <div class="label">Foto a colori normali</div>
        <div class="desc">Non invertire immagini e video.</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="keepImages" checked>
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="section">
    <div class="row">
      <div>
        <div class="label">Predefinito su tutti i siti</div>
        <div class="desc">Nuovi siti partono scuri.</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="globalToggle" checked>
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <footer>Notte · Dark Mode</footer>

  <script src="popup.js"></script>
</body>
</html>
