<!doctype html>
<html>
<head>
<style>
  html, body { margin: 0; background: #ffffff; }
  .shell { position: fixed; inset: 0; background: #ffffff !important; }
  .card { position: relative; background: #f2f2f2; color: #111; padding: 24px; margin: 16px; }
</style>
</head>
<body>
  <div class="shell"></div>
  <div class="card">hello</div>
  <script>
    // Simulate a late SPA render inserting a white-backed card after first paint.
    setTimeout(function () {
      var d = document.createElement("div");
      d.className = "card";
      d.style.background = "#ffffff";
      d.textContent = "late";
      document.body.appendChild(d);
    }, 120);
  </script>
</body>
</html>
