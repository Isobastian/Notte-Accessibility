<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { background: #ffffff; color: #111111; }
  .card { background: #f5f5f5; color: #222222; border: 1px solid #dddddd; }
  .btn { background: #2563eb; color: #ffffff; }
  .grad { background: linear-gradient(#ffffff, #eeeeee); }
  :root { --panel: #ffffff; }
  .panel { background-color: var(--panel); color: #000000; }
  @media (min-width: 1px) { .media { background: #ffffff; color: #101010; } }
  .imp { background: #ffffff !important; color: #111111 !important; }
  .rowA { background: #ffffff; }
  .rowB { background: #e1dfdd; } /* OWA "selected" grey — must stay distinct from rowA */
  .shadowed { box-shadow: 0 0 0 1px #ffffff; background: #ffffff; }
  /* MeteoSvizzera-style raw rgb-channel tokens consumed via rgb(var()) */
  :root { --mch-surface: 233 237 240; --mch-topbar: 224, 228, 232; --mch-text: 30 40 50; }
  .band { background: rgb(var(--mch-surface)); color: rgb(var(--mch-text)); }
  .topbar { background-color: rgb(var(--mch-topbar)); }
  /* shorthand var() bg + chained tokens (the last MeteoSvizzera hold-outs) */
  :root { --leaf: #ffffff; --chain: var(--leaf); --dtok: #1c2834; --chaintxt-tok: var(--dtok); }
  .shortbg { background: var(--leaf); color: #000; }
  .chainbg { background-color: var(--chain); color: #000; }
  .chaintxt { background-color: #ffffff; color: var(--chaintxt-tok); }
</style>
</head>
<body>
  <div class="card">card</div>
  <button class="btn">button</button>
  <div class="grad">grad</div>
  <div class="panel">panel</div>
  <div class="media">media</div>
  <div class="imp">important</div>
  <div class="rowA">rowA</div>
  <div class="rowB">rowB</div>
  <div class="shadowed">shadowed panel</div>
  <div class="band">token band</div>
  <div class="topbar">token topbar</div>
  <div class="shortbg">shorthand var bg</div>
  <div class="chainbg">chained token bg</div>
  <div class="chaintxt">chained dark token as text</div>
  <div id="inline" style="background:#ffffff;color:#000000">inline</div>
</body>
</html>
