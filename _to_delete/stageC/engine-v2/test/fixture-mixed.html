<!doctype html>
<html>
<head>
<style>
  html, body { margin: 0; background: #eaeef1; }   /* LIGHT page backdrop */
  .darkheader { background: #0a0a0a; color: #fff; height: 320px; }  /* dark header, like MeteoSvizzera */
  .darkpanel { background: #1c1f24; height: 300px; }               /* dark map panel */
  .content { background: #ffffff; color: #111111; padding: 24px; }  /* light band that must darken */
</style>
</head>
<body>
  <div class="darkheader">dark header</div>
  <div class="content">light content band</div>
  <div class="darkpanel">dark panel</div>
</body>
</html>
